<!-- Stretch-->
<style>
 .stretch{
  color:white;
  background-color: green;
  padding-top: 10px;
  padding-bottom:10px;
  padding-right: 6px;
  padding-left: 6px;
  margin-left: 5px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: padding-top 1s, padding-left 1s, padding-bottom 1s, padding-right 1s;
 }
 .stretch:hover{
  padding-top:20px;
  padding-bottom:20px;
  padding-right: 12px;
  padding-left: 12px; 
 }
</style>
<button class="stretch">Streatch</button>

<!-- 3D click-->
<style>
 .shadow{
  color:white;
  background-color: green;
  padding-top: 10px;
  padding-bottom:10px;
  padding-right: 6px;
  padding-left: 6px;
  margin-left: 5px;
  border: none;
  cursor: pointer;
  font-weight: bold;
 }
 .shadow:hover{
  box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.25);
 }

 .shadow:active{
  padding-top: 8px;
  padding-bottom:8px;
  padding-right: 4px;
  padding-left: 4px;
  margin-top: 5px;
  margin-left: 10px;
 }
</style>


<button class="shadow">
  Shadow
</button>
